<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Latihan 6</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-template-rows: 100px auto;
      gap: 10px;
      height: 100vh;
    }
    .box {
      background: lightseagreen;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </div>
</body>
</html>
