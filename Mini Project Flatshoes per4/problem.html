<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashsoft Indonesia - Problem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .section { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 50px; 
            padding: 3% 7%; }
    </style>
</head>
<body>

    <section class="section" id="problem">
        <div style="flex:1; min-width:280px; padding:30px; text-align:center;">
        <img src="https://flashsoftindonesia.com/fs-logo-vertical.png"
         alt="Logo Flashsoft" width="50%">
        </div>

        <div style="flex:1; min-width:300px;">
            <p style="text-align:start; letter-spacing:0.1em; text-transform:uppercase;">
                <span style="color:#6a1b9a; font-weight:bolder;">##</span>
                Kendala dan Solusi
            </p>

            <h2 style="font-size:30px; margin-bottom:20px; font-weight:lighter;
                line-height:normal; max-width:50%;">
                <span style="color:#6a1b9a; font-weight:bolder;">Kendala</span>
                yang Sering Dihadapi Calon Programmer
            </h2>
            
            <ul style="text-align:start; list-style:none;">
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                    <i class="fa-solid fa-xmark" style="color:#c00; margin-right:8px;"></i>Belajar Sendiri Tanpa Arah
                    </h3>
                    </li>
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                        <i class="fa-solid fa-xmark" style="color:#c00; margin-right:8px;"></i>
                        Kurang Latihan & Proyek Nyata
                    </h3>
                </li>
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                        <i class="fa-solid fa-xmark" style="color:#c00; margin-right:8px;"></i>
                        Tidak Punya Mentor
                    </h3>
                </li>
            </ul>
            <hr style="color:#673499; margin:30px 0;">
            <h2 style="font-size:30px; margin-bottom:20px; font-weight:lighter; line-height:normal;">
                <span style="color:#6a1b9a; font-weight:bolder;">Solusi</span> kami
            </h2>
            <ul style="text-align:start; list-style:none;">
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                        <i class="fa-solid fa-check" style="color:#1EBE57; margin-right:8px;"></i>
                        Program Belajar Terarah
                    </h3>
                </li>
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                        <i class="fa-solid fa-check" style="color:#1EBE57; margin-right:8px;"></i>
                        Bimbingan Mentor Profesional
                    </h3>
                </li>
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                        <i class="fa-solid fa-check" style="color:#1EBE57; margin-right:8px;"></i>
                        Latihan & Proyek Nyata
                    </h3>
                </li>
                <li>
                    <h3 style="font-weight:lighter; font-size:medium;">
                        <i class="fa-solid fa-check" style="color:#1EBE57; margin-right:8px;"></i>
                        Komunitas & Dukungan Belajar
                    </h3>
                </li>
            </ul>
        </div>
    </section>
</body>
</html>
