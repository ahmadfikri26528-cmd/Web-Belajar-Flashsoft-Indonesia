<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan 2</title>
  <style>
    .container {
      /* width: 600px; <--- Baris ini sudah dihapus agar kotak full ke kanan */
      border: 2px dashed gray;
      background: #673499;
      padding: 5%;
    }
    
    .box {
      width: 450px; /* Lebar teks dibatasi agar bentuk kalimatnya persis seperti di gambar */
      margin: 0 auto; /* Mendorong blok teks ke tengah layar */
      background: #673499;
      color: white;
    }
    
    .btn {
      padding: 10px 20px;
      background-color: white;
      color: #673499;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px; /* Memberikan sedikit jarak agar tombol tidak menempel */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Flashsoft Indonesia</h1>
      <p>
        Kami membantu Anda membangun solusi software dan mengembangkan talenta digital
        melalui program pelatihan, bootcamp, dan pembelajaran interaktif.
      </p>
      <a href="#pricing" class="btn">Jelajahi Program</a>
    </div>
  </div>
</body>
</html>
